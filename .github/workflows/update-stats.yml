name: Update GitHub Stats

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for stale data
        run: echo "All badges are live (followers, repos via shields.io API). No manual update needed."

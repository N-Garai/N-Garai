name: Update GitHub Stats

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch comprehensive GitHub stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER=$(gh api users/N-Garai --jq '{repos: .public_repos, followers: .followers}')
          REPOS=$(echo "$USER" | jq -r '.repos')
          FOLLOWERS=$(echo "$USER" | jq -r '.followers')

          TOTAL=$(gh api graphql -f query='
            query {
              user(login: "N-Garai") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "followers=$FOLLOWERS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Update README badges
        run: |
          REPOS=${{ steps.stats.outputs.repos }}
          FOLLOWERS=${{ steps.stats.outputs.followers }}
          TOTAL=${{ steps.stats.outputs.total }}

          sed -i "s|\(badge/Contributions-\)[0-9]*\(-brightgreen\)|\1$TOTAL\2|g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push

name: Update GitHub Stats

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total contributions
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(gh api graphql -f query='
            query {
              user(login: "N-Garai") {
                contributionsCollection(from: "2025-02-13T00:00:00Z") {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Update contributions badge
        run: |
          TOTAL=${{ steps.stats.outputs.total }}
          sed -i "s|\(badge/Contributions-\)[0-9]*\(-brightgreen\)|\1$TOTAL\2|g" README.md

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update contributions count [skip ci]"
          git push

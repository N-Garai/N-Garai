name: Update GitHub Stats

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total contributions
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOTAL=$(gh api graphql -f query='
            query {
              user(login: "N-Garai") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Update README with total contributions
        run: |
          TOTAL=${{ steps.stats.outputs.total }}
          sed -i "s/<!-- TOTAL_CONTRIB -->[0-9]*<!-- TOTAL_CONTRIB_END -->/<!-- TOTAL_CONTRIB -->$TOTAL<!-- TOTAL_CONTRIB_END -->/g" README.md

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: N-Garai
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
